[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "m-router"
version = "0.1.0"
description = "Python SDK for routing LLM calls through M-Router."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "M-Router" }]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
