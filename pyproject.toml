[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "brane-sdk"
version = "0.1.0"
description = "Python SDK for routing agent LLM calls through Brane."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Membrane Labs", email = "ro@membranelabs.org" }]
maintainers = [{ name = "Membrane Labs", email = "ro@membranelabs.org" }]
keywords = ["agents", "llm", "routing", "langgraph", "langchain", "observability", "brane"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://brane.membranelabs.org"
Repository = "https://github.com/NAGANITHIN23/BRANE-SDK"
Issues = "https://github.com/NAGANITHIN23/BRANE-SDK/issues"

[project.optional-dependencies]
langchain = ["langchain-core>=0.3"]
providers = [
  "langchain-openai>=0.3",
  "langchain-anthropic>=0.3",
  "langchain-google-genai>=2.0",
]
test = ["pytest>=7.4"]
dev = ["build>=1.2", "twine>=5.0", "pytest>=7.4"]

[tool.setuptools.packages.find]
include = ["m_router*"]
exclude = ["tests*", "brane-cloud*", "brane-cloud-frontend*"]

[tool.setuptools.package-data]
m_router = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
